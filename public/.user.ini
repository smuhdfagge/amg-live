; Lets the admin upload radio programmes and videos.
; Read by PHP-FPM / CGI hosting (most cPanel accounts). Changes can take up
; to 5 minutes to apply. If uploads are still limited, raise these values in
; cPanel > MultiPHP INI Editor, or ask your host.
upload_max_filesize = 256M
post_max_size = 260M
max_execution_time = 300
max_input_time = 300
